<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8a98a8);
      --button: var(--tg-theme-button-color, #2ea6ff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #2ea6ff;
      --danger: #ff5f56;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--hint);
      font-size: 15px;
    }

    #tracksContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .track-card {
      background: var(--secondary-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .track-card:hover {
      transform: translateY(-4px);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }

    .track-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }

    .listen-btn {
      border: none;
      background: var(--button);
      color: var(--button-text);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
      margin-top: auto;
    }

    .listen-btn:hover {
      opacity: 0.9;
    }

    .listen-btn:active {
      transform: scale(0.98);
    }

    .message-box {
      background: rgba(255, 95, 86, 0.15);
      border: 1px solid rgba(255, 95, 86, 0.4);
      color: #ffb0ab;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      font-size: 15px;
    }

    /* ================= PLAYER (hidden for now) ================= */

    .player-container {
      display: none; /* Для включения: document.querySelector('.player-container').style.display='block'; */
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--secondary-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
      z-index: 999;
    }

    .cover-display {
      width: 220px;
      height: 220px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 16px 0;
    }

    .player-btn {
      background: var(--button);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .progress {
      width: 100%;
      margin-top: 16px;
    }

    max-width: 700px {
      #tracksContainer {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
    }

    max-width: 480px {
      #tracksContainer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="title


id="greeting">Привет, друг! 👋</div>
    <div class="subtitle">Выбирай треки и слушай музыку</div>
  </div>

  <div id="tracksContainer">
    <div class="message-box">
      Загрузка треков...
    </div>
  </div>

  <!-- ================= FUTURE PLAYER ================= -->

  <div class="player-container">

    <div class="cover-display" id="playerCover">
      🎵
    </div>

    <audio id="mainAudio"></audio>

    <div class="player-controls">
      <button class="player-btn" id="prevBtn">⏮</button>
      <button class="player-btn" id="playPauseBtn">▶️</button>
      <button class="player-btn" id="nextBtn">⏭</button>
    </div>

    <input
      type="range"
      class="progress"
      id="progressBar"
      min="0"
      max="100"
      value="0"
    />

  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ================= GREETING =================

    function initGreeting() {
      const userName =
        tg?.initDataUnsafe?.user?.first_name?.trim() || "друг";

      document.getElementById("greeting").textContent =
        `Привет, ${userName}! 👋`;
    }

    initGreeting();

    // ================= PLAYER STUB =================

    const player = {
      currentTrack: null,

      play(track) {
        console.log('▶️ Запуск трека:', track.file_path);

        // БУДУЩЕЕ:
        // document.querySelector('.player-container').style.display = 'block';
        // mainAudio.src = track.file_path;
        // mainAudio.play();

        if (tg && tg.openLink) {
          tg.openLink(track.file_path);
        } else {
          window.open(track.file_path, '_blank');
        }
      }
    };

    // ================= RENDER =================

    function renderTracks(tracks) {
      const container = document.getElementById("tracksContainer");

      if (!tracks || tracks.length === 0) {
        container.innerHTML = `
          <div class="message-box">
            Треки не найдены.
          </div>
        `;
        return;
      }

      container.innerHTML = tracks.map(track => `
        <div class="track-card">
          <div class="cover">
            ${track.cover || '🎵'}
          </div>

          <div class="track-title">
            ${track.title || 'Без названия'}
          </div>

          <button class="listen-btn" data-id="${track.id}">
            Слушать
          </button>
        </div>
      `).join('');

      document.querySelectorAll('.listen-btn').forEach(button => {
        button.addEventListener('click', () => {
          const id = button.dataset.id;
          const track = tracks.find(t => String(t.id) === id);

          if (track) {
            player.play(track);
          }
        });
      });
    }

    // ================= LOAD TRACKS =================

    async function loadTracks() {
      const container = document.getElementById("tracksContainer");

      try {
        const response = await fetch('data.json', {
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: data.json не найден`
          );
        }

        const tracks = await response.json();

        if (!Array.isArray(tracks)) {
          throw new Error(
            'data.json должен содержать массив треков'
          );
        }

        console.log(`✅ Треки загружены: ${tracks.length} шт.`);

        renderTracks(tracks);

      } catch (error) {

        console.error('❌ Ошибка:', error);

        container.innerHTML = `
          <div class="message-box">
            <strong>Не удалось загрузить треки</strong>
<b

       Проверьте:
            
• 
ствует ли data.json
            
• 
ильный ли JSON
            
• 
ужены ли файлы на GitHub Pages
          </div>
        `;
      }
    }

    loadTracks();
  </script>

</body>
</html>"
