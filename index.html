<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
    .card { background: white; padding: 10px; border-radius: 10px; text-align: center; }
    .cover { width: 100%; height: 120px; background: #eee; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    button { background: #2481cc; color: white; border: none; padding: 8px 16px; border-radius: 6px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <h1 id="greet">Привет!</h1>
  <div id="list" class="grid"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const tracks = [
      { title: 'Трек 1', cover: '🎵', url: 'audio/track1.mp3' },
      { title: 'Newstar', cover: '⭐', url: 'audio/newstar.mp3' },
      { title: 'Slikk', cover: '🔥', url: 'audio/slikk.mp3' }
    ];

    document.getElementById('greet').innerText = `Привет, \${tg.initDataUnsafe?.user?.first_name || 'друг'}!`;

    const container = document.getElementById('list');
    tracks.forEach(t => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="cover">\${t.cover}</div>
        <div>\${t.title}</div>
        <button onclick="tg.openLink('\${t.url}')">Слушать</button>
      `;
      container.appendChild(el);
    });
  </script>
</body>
</html>
