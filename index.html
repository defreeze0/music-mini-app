<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0b0b0d);
      --surface: var(--tg-theme-secondary-bg-color, #161618);
      --text: var(--tg-theme-text-color, #f5f5f7);
      --hint: var(--tg-theme-hint-color, #7c7c82);
      --accent: var(--tg-theme-button-color, #4f8cff);
      --on-accent: var(--tg-theme-button-text-color, #ffffff);
      --stroke: rgba(255, 255, 255, 0.06);
      --glow: rgba(80, 120, 255, 0);
      --glow-soft: rgba(80, 120, 255, 0);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 96px 0;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 0 20px; }

    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
    .sub { margin: 4px 0 0 0; color: var(--hint); font-size: 13.5px; }

    .search-box { margin-top: 22px; position: relative; }
    .search-box svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--hint); pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: rgba(255, 255, 255, 0.18); }
    .search-input::placeholder { color: var(--hint); }

    .tabs { display: flex; gap: 8px; margin-top: 12px; }
    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--stroke);
      color: var(--hint);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active { background: var(--surface); color: var(--text); border-color: transparent; }

    .add-btn {
      margin-top: 14px;
      width: 100%;
      display: none; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .add-btn.visible { display: flex; }
    .add-btn:active { transform: scale(0.98); opacity: 0.85; }

    .list { margin-top: 10px; }
    .online-hint {
      margin-top: 14px;
      color: var(--hint);
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      padding: 16px;
    }
    .status-line {
      margin-top: 20px;
      color: var(--hint);
      font-size: 13.5px;
      text-align: center;
      padding: 12px;
    }

    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .row:hover { background: var(--surface); }
    .row:active { background: var(--surface); }
    .row.playing .row-title { color: var(--accent); }

    .cover-art {
      width: 52px; height: 52px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .cover-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-art .letter {
      font-size: 18px; font-weight: 700;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    .row-main { flex-grow: 1; min-width: 0; }
    .row-title {
      font-size: 14.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-artist {
      font-size: 12.5px; color: var(--hint);
      margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .eq {
      display: none; align-items: flex-end; gap: 2px;
      width: 16px; height: 14px; flex-shrink: 0;
    }
    .row.playing .eq { display: flex; }
    .eq span {
      width: 3px; background: var(--accent); border-radius: 1px;
      animation: eq 0.9s ease-in-out infinite;
    }
    .eq span:nth-child(1) { height: 55%; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 100%; animation-delay: 0.25s; }
    .eq span:nth-child(3) { height: 40%; animation-delay: 0.5s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .row-action {
      background: transparent;
      border: none;
      color: var(--hint);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex; align-items: center;
      transition: color 0.2s;
    }
    .row-action:hover { color: var(--text); }
    .row-action.add:hover { color: var(--accent); }

    .empty {
      margin-top: 14px;
      color: var(--hint);
      font-size: 13.5px;
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed var(--stroke);
      border-radius: 16px;
      line-height: 1.6;
    }

    /* ---------- Мини-плеер ---------- */
    .mini-player {
      position: fixed;
      left: 12px; right: 12px; bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 10px 10px;
      display: flex; align-items: center; gap: 6px;
      z-index: 90;
      opacity: 0; visibility: hidden; transform: translateY(20px);
      transition: all 0.25s ease, box-shadow 0.6s ease;
      box-shadow: 0 10px 30px var(--glow-soft, rgba(0, 0, 0, 0.4));
      cursor: pointer;
    }
    .mini-player.active { opacity: 1; visibility: visible; transform: translateY(0); }

    .mini-cover {
      width: 42px; height: 42px;
      border-radius: 9px;
      overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-cover img { width: 100%; height: 100%; object-fit: cover; }
    .mini-cover .letter { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.55); width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

    .mini-main { flex-grow: 1; min-width: 0; }
    .mini-title {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-bar {
      height: 3px; margin-top: 7px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px; overflow: hidden;
    }
    .mini-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }

    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    .icon-btn:active { background: rgba(255,255,255,0.08); }
    .icon-btn.accented { color: var(--accent); }

    .icon-btn.sm { width: 30px; height: 30px; }
    .icon-btn.sm svg { width: 16px; height: 16px; }

    .play-round {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .play-round:active { transform: scale(0.93); }

    /* ---------- Полноэкранный плеер ---------- */
    .full-player {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 130% 55% at 50% -8%, var(--glow), transparent 65%),
        var(--bg);
      z-index: 200;
      display: flex; flex-direction: column;
      padding: 20px 24px calc(28px + env(safe-area-inset-bottom)) 24px;
      opacity: 0; visibility: hidden; transform: translateY(30px);
      transition: all 0.28s ease, background 0.6s ease;
    }
    .full-player.active { opacity: 1; visibility: visible; transform: translateY(0); }

    .fp-top { display: flex; align-items: center; justify-content: space-between; }
    .fp-label { color: var(--hint); font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

    .fp-cover {
      width: min(72vw, 280px);
      aspect-ratio: 1;
      border-radius: 20px;
      margin: 8vh auto 0 auto;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 20px 60px var(--glow-soft, rgba(0, 0, 0, 0.5));
      flex-shrink: 0;
      transition: box-shadow 0.6s ease;
    }
    .fp-cover img { width: 100%; height: 100%; object-fit: cover; }
    .fp-cover .letter { font-size: 84px; font-weight: 700; color: rgba(255,255,255,0.5); }

    .fp-meta { margin-top: auto; }
    .fp-title { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .fp-artist { font-size: 14px; color: var(--hint); margin-top: 4px; }

    .fp-progress { margin-top: 20px; }
    .fp-track { height: 20px; display: flex; align-items: center; cursor: pointer; }
    .fp-line { height: 5px; width: 100%; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
    .fp-line-fill { height: 100%; width: 0%; background: var(--text); border-radius: 3px; }
    .fp-times {
      display: flex; justify-content: space-between;
      font-size: 11.5px; color: var(--hint); margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .fp-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px;
    }
    .fp-controls .side { width: 40px; }
    .fp-play {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .fp-play:active { transform: scale(0.94); }

    .radio-badge {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      display: none; align-items: center; gap: 6px;
      color: var(--accent);
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    }
    .radio-badge.on { display: flex; }
    .radio-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    #mainAudio { display: none; }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="greeting">Музыка</h1>
    <p class="sub">Ваша библиотека</p>

    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Поиск по трекам" />
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLib">Библиотека</button>
      <button class="tab" id="tabOnline">Онлайн</button>
    </div>

    <button class="add-btn" id="addBtn">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      Добавить трек
    </button>
    <input type="file" id="fileInput" multiple />

    <div id="app" class="list"></div>
    <div id="onlineBox" class="list" style="display:none;"></div>
  </div>

  <!-- Мини-плеер -->
  <div class="mini-player" id="miniPlayer">
    <div class="mini-cover" id="miniCover"></div>
    <div class="mini-main" id="miniMain">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-bar"><div class="mini-fill" id="miniFill"></div></div>
    </div>
    <button class="icon-btn sm shuffle-toggle" title="Перемешать">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
    <button class="play-round" id="miniPlayBtn"></button>
    <button class="icon-btn sm repeat-toggle" title="Повтор">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
    <button class="icon-btn sm" id="miniNextBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>

  <!-- Полноэкранный плеер -->
  <div class="full-player" id="fullPlayer">
    <div class="fp-top">
      <span class="fp-label">Сейчас играет</span>
      <button class="icon-btn" id="fpCloseBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
    </div>

    <div class="radio-badge" id="radioBadge"><span class="dot"></span>Радио по вайбу</div>

    <div class="fp-cover" id="fpCover"></div>

    <div class="fp-meta">
      <div class="fp-title" id="fpTitle">—</div>
      <div class="fp-artist" id="fpArtist"></div>

      <div class="fp-progress">
        <div class="fp-track" id="fpTrackBar">
          <div class="fp-line"><div class="fp-line-fill" id="fpFill"></div></div>
        </div>
        <div class="fp-times">
          <span id="fpCur">0:00</span>
          <span id="fpDur">0:00</span>
        </div>
      </div>

      <div class="fp-controls">
        <button class="icon-btn side shuffle-toggle">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="icon-btn side" id="prevBtn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zM18 6v12l-8.5-6z"/></svg>
        </button>
        <button class="fp-play" id="playPauseBtn"></button>
        <button class="icon-btn side" id="nextBtn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button class="icon-btn side repeat-toggle">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
        <button class="icon-btn side" id="radioBtn" title="Радио по вайбу">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-3.54 3.54-1.41-1.41a7 7 0 0 1 0-9.9l1.41 1.42a5 5 0 0 0 0 7.07zm7.08 0 1.41-1.41a7 7 0 0 0 0-9.9l-1.41 1.42a5 5 0 0 1 0 7.07z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <audio id="mainAudio"></audio>

  <script>
    (function () {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      const storage = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      try {
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u && u.first_name) document.getElementById('greeting').textContent = 'Привет, ' + u.first_name;
      } catch (e) {}

      const ICONS = {
        play: '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
        playSm: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
        pauseSm: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2h4v2H4V6h4l1-2z"/></svg>',
        plus: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
        ok: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>'
      };

      const audio = document.getElementById('mainAudio');
      const container = document.getElementById('app');
      const onlineBox = document.getElementById('onlineBox');
      const searchInput = document.getElementById('searchInput');
      const tabLib = document.getElementById('tabLib');
      const tabOnline = document.getElementById('tabOnline');
      const addBtn = document.getElementById('addBtn');

      const miniPlayer = document.getElementById('miniPlayer');
      const miniCover = document.getElementById('miniCover');
      const miniTitle = document.getElementById('miniTitle');
      const miniFill = document.getElementById('miniFill');
      const miniPlayBtn = document.getElementById('miniPlayBtn');
      const miniNextBtn = document.getElementById('miniNextBtn');

      const fullPlayer = document.getElementById('fullPlayer');
      const fpCover = document.getElementById('fpCover');
      const fpTitle = document.getElementById('fpTitle');
      const fpArtist = document.getElementById('fpArtist');
      const fpFill = document.getElementById('fpFill');
      const fpTrackBar = document.getElementById('fpTrackBar');
      const fpCur = document.getElementById('fpCur');
      const fpDur = document.getElementById('fpDur');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const radioBtn = document.getElementById('radioBtn');
      const radioBadge = document.getElementById('radioBadge');

      const shuffleBtns = document.querySelectorAll('.shuffle-toggle');
      const repeatBtns = document.querySelectorAll('.repeat-toggle');

      let allTracks = [];
      let current = -1;
      let activeTab = 'lib';
      let lastOnline = null; // последний онлайн-трек для радио

      let shuffleOn = storage.get('shuffleOn') === '1';
      let repeatOn = storage.get('repeatOn') === '1';
      let radioOn = false;
      audio.loop = repeatOn;
      updateModeButtons();

      function updateModeButtons() {
        shuffleBtns.forEach(b => b.classList.toggle('accented', shuffleOn));
        repeatBtns.forEach(b => b.classList.toggle('accented', repeatOn));
        radioBtn.classList.toggle('accented', radioOn);
        radioBadge.classList.toggle('on', radioOn);
      }

      shuffleBtns.forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        shuffleOn = !shuffleOn;
        storage.set('shuffleOn', shuffleOn ? '1' : '0');
        updateModeButtons();
      }));

      repeatBtns.forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        repeatOn = !repeatOn;
        storage.set('repeatOn', repeatOn ? '1' : '0');
        audio.loop = repeatOn;
        updateModeButtons();
      }));

      radioBtn.addEventListener('click', () => {
        radioOn = !radioOn;
        updateModeButtons();
        if (radioOn && current === -1 && lastOnline) {
          // включили радио, когда ничего не играет — стартуем с последнего онлайн-трека
          playOnlineTrack(lastOnline, true);
        }
      });

      // ---------- IndexedDB ----------
      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('musicApp', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGetAll() {
        const db = await openDB();
        return new Promise((resolve) => {
          const req = db.transaction('tracks').objectStore('tracks').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }

      async function idbPut(track) {
        const db = await openDB();
        db.transaction('tracks', 'readwrite').objectStore('tracks').put(track);
      }

      async function idbDelete(id) {
        const db = await openDB();
        db.transaction('tracks', 'readwrite').objectStore('tracks').delete(id);
      }

      // ---------- Теги ----------
      function readTags(file) {
        return new Promise((resolve) => {
          if (!window.jsmediatags) { resolve({}); return; }
          try {
            window.jsmediatags.read(file, {
              onSuccess: (r) => resolve(r.tags || {}),
              onError: () => resolve({})
            });
          } catch (e) { resolve({}); }
        });
      }

      function pictureToDataURL(pic) {
        if (!pic || !pic.data) return null;
        let binary = '';
        const bytes = new Uint8Array(pic.data);
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return 'data:' + (pic.format || 'image/jpeg') + ';base64,' + btoa(binary);
      }

      // ---------- Обложка ----------
      function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
        return Math.abs(h);
      }

      function coverHTML(url, title, letterSize) {
        if (url) return '<img src="' + url + '" alt="" />';
        const h = hashCode(title || 'track') % 360;
        const bg = 'background: radial-gradient(circle at 30% 25%, hsl(' + h + ', 30%, 22%), hsl(' + h + ', 28%, 10%));';
        const letter = (title || '?').trim().charAt(0).toUpperCase();
        return '<div class="letter" style="' + bg + ' font-size:' + letterSize + 'px;">' + letter + '</div>';
      }

      // ---------- Подсветка под цвет обложки ----------
      function applyGlow(track) {
        if (track && track.coverUrl) {
          extractColor(track.coverUrl).then(rgb => {
            if (rgb) setGlow(rgb.r, rgb.g, rgb.b);
          });
        } else {
          const h = hashCode((track && track.title) || 'track') % 360;
          const rgb = hslToRgb(h / 360, 0.35, 0.35);
          setGlow(rgb.r, rgb.g, rgb.b);
        }
      }

      function setGlow(r, g, b) {
        document.documentElement.style.setProperty('--glow', 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
        document.documentElement.style.setProperty('--glow-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
      }

      function extractColor(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            try {
              const c = document.createElement('canvas');
              c.width = c.height = 20;
              const ctx = c.getContext('2d');
              ctx.drawImage(img, 0, 0, 20, 20);
              const d = ctx.getImageData(0, 0, 20, 20).data;
              let r = 0, g = 0, b = 0, n = 0;
              for (let i = 0; i < d.length; i += 4) {
                if (d[i + 3] > 128) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
              }
              if (!n) { resolve(null); return; }
              resolve({ r: Math.round(r / n), g: Math.round(g / n), b: Math.round(b / n) });
            } catch (e) { resolve(null); }
          };
          img.onerror = () => resolve(null);
          img.src = url;
        });
      }

      function hslToRgb(h, s, l) {
        const a = s * Math.min(l, 1 - l);
        const f = (n) => {
          const k = (n + h * 12) % 12;
          return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))));
        };
        return { r: f(0), g: f(8), b: f(4) };
      }

      // ---------- Табы ----------
      function setTab(tab) {
        activeTab = tab;
        tabLib.classList.toggle('active', tab === 'lib');
        tabOnline.classList.toggle('active', tab === 'online');
        container.style.display = tab === 'lib' ? '' : 'none';
        onlineBox.style.display = tab === 'online' ? '' : 'none';
        addBtn.classList.toggle('visible', tab === 'lib');
        if (tab === 'online') searchInput.placeholder = 'Поиск музыки онлайн';
        else searchInput.placeholder = 'Поиск по трекам';
        if (tab === 'online') runOnlineSearch();
      }

      tabLib.addEventListener('click', () => setTab('lib'));
      tabOnline.addEventListener('click', () => setTab('online'));

      // ---------- Audius ----------
      const APP_NAME = 'music-mini-app';
      let audiusHost = null;

      async function getAudiusHost() {
        if (audiusHost) return audiusHost;
        const r = await fetch('https://api.audius.co');
        const j = await r.json();
        audiusHost = j.data[0];
        return audiusHost;
      }

      function streamUrl(id) {
        return (audiusHost || 'https://discoveryprovider.audius.co') + '/v1/tracks/' + id + '/stream?app_name=' + APP_NAME;
      }

      let searchTimer = null;

      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        if (activeTab === 'lib') { render(); return; }
        searchTimer = setTimeout(runOnlineSearch, 450);
      });

      async function runOnlineSearch() {
        const q = (searchInput.value || '').trim();
        if (q.length < 2) {
          if (!q) onlineBox.innerHTML = '<div class="online-hint">Полноценные треки от независимых артистов через открытую платформу Audius.<br>Ищите, слушайте и добавляйте в библиотеку.</div>';
          return;
        }
        onlineBox.innerHTML = '<div class="status-line">Ищу «' + q + '»...</div>';

        try {
          const host = await getAudiusHost();
          const r = await fetch(host + '/v1/tracks/search?query=' + encodeURIComponent(q) + '&app_name=' + APP_NAME);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          const results = (j.data || []).slice(0, 15);

          if (results.length === 0) {
            onlineBox.innerHTML = '<div class="empty">Ничего не нашлось по запросу «' + q + '».<br>Попробуйте другое слово.</div>';
            return;
          }

          onlineBox.innerHTML = '';
          results.forEach(t => {
            const row = document.createElement('div');
            row.className = 'row';

            const cover = document.createElement('div');
            cover.className = 'cover-art';
            const art = t.artwork ? (t.artwork['150x150'] || t.artwork['480x480']) : null;
            cover.innerHTML = coverHTML(art, t.title, 18);

            const main = document.createElement('div');
            main.className = 'row-main';
            const artist = t.user ? t.user.name : '';
            main.innerHTML = '<div class="row-title"></div>' + (artist ? '<div class="row-artist"></div>' : '');
            main.querySelector('.row-title').textContent = t.title || 'Без названия';
            if (artist) main.querySelector('.row-artist').textContent = artist;

            const playB = document.createElement('button');
            playB.className = 'row-action';
            playB.innerHTML = ICONS.playSm;
            playB.addEventListener('click', (e) => { e.stopPropagation(); playOnline(t, art, artist); });

            const addB = document.createElement('button');
            addB.className = 'row-action add';
            addB.innerHTML = ICONS.plus;
            addB.addEventListener('click', async (e) => {
              e.stopPropagation();
              addB.innerHTML = ICONS.ok;
              await addOnline(t);
              addB.innerHTML = ICONS.plus;
            });

            row.appendChild(cover);
            row.appendChild(main);
            row.appendChild(playB);
            row.appendChild(addB);
            onlineBox.appendChild(row);
          });
        } catch (e) {
          onlineBox.innerHTML = '<div class="status-line">Сервис поиска недоступен. Попробуйте ещё раз.</div>';
        }
      }

      function playOnline(t, art, artist) {
        lastOnline = { id: t.id, title: t.title, artist: artist, art: art };
        playOnlineTrack(lastOnline, false);
      }

      function playOnlineTrack(o, keepRadio) {
        audio.src = streamUrl(o.id);
        current = -1;
        const label = o.artist ? o.artist + ' — ' + o.title : o.title;
        miniTitle.textContent = label;
        miniCover.innerHTML = coverHTML(o.art, o.title, 15);
        fpTitle.textContent = o.title || 'Без названия';
        fpArtist.textContent = o.artist || ' ';
        fpCover.innerHTML = coverHTML(o.art, o.title, 84);
        miniPlayer.classList.add('active');
        applyGlow({ coverUrl: o.art, title: o.title });
        audio.play();
        if (!keepRadio) render();
      }

      async function addOnline(t) {
        const rec = {
          id: Date.now() + Math.random(),
          addedAt: Date.now(),
          title: t.title || 'Без названия',
          artist: t.user ? t.user.name : '',
          coverUrl: t.artwork ? (t.artwork['480x480'] || t.artwork['150x150']) : null,
          audiusId: t.id
        };
        try {
          const resp = await fetch(streamUrl(t.id));
          if (resp.ok) rec.blob = await resp.blob();
        } catch (e) {}
        if (!rec.blob) rec.src = streamUrl(t.id);
        await idbPut(rec);
        await loadTracks();
      }

      // ---------- Радио по вайбу ----------
      async function radioNext() {
        if (!radioOn) return;
        // 1. Если играет онлайн-трек — ищем похожие через Audius
        const curOnline = (current >= 0 && allTracks[current] && allTracks[current].audiusId)
          ? allTracks[current]
          : (current === -1 && lastOnline ? { audiusId: lastOnline.id, title: lastOnline.title } : null);

        if (curOnline && curOnline.audiusId) {
          try {
            const host = await getAudiusHost();
            const r = await fetch(host + '/v1/tracks/' + curOnline.audiusId + '/similar?app_name=' + APP_NAME);
            if (r.ok) {
              const j = await r.json();
              const list = (j.data || []).filter(x => x && x.id);
              if (list.length) {
                const pick = list[Math.floor(Math.random() * list.length)];
                const art = pick.artwork ? (pick.artwork['150x150'] || pick.artwork['480x480']) : null;
                playOnline(pick, art, pick.user ? pick.user.name : '');
                return;
              }
            }
          } catch (e) {}
        }
        // 2. Фолбэк: случайный трек из библиотеки
        if (allTracks.length > 1) playTrack(nextIndex());
      }

      // ---------- Рендер библиотеки ----------
      function render() {
        const q = (searchInput.value || '').trim().toLowerCase();
        const visible = allTracks.filter(t => !q || (t.title + ' ' + (t.artist || '')).toLowerCase().includes(q));

        container.innerHTML = '';
        if (allTracks.length === 0) {
          container.innerHTML = '<div class="empty">Библиотека пуста.<br>Добавьте треки кнопкой выше или найдите на вкладке «Онлайн».</div>';
          return;
        }
        if (visible.length === 0) {
          container.innerHTML = '<div class="empty">Ничего не найдено по запросу «' + q + '».</div>';
          return;
        }

        visible.forEach((track) => {
          const i = allTracks.indexOf(track);
          const row = document.createElement('div');
          row.className = 'row' + (i === current ? ' playing' : '');

          const cover = document.createElement('div');
          cover.className = 'cover-art';
          cover.innerHTML = coverHTML(track.coverUrl, track.title, 18);

          const main = document.createElement('div');
          main.className = 'row-main';
          main.innerHTML =
            '<div class="row-title"></div>' +
            (track.artist ? '<div class="row-artist"></div>' : '');
          main.querySelector('.row-title').textContent = track.title || 'Без названия';
          if (track.artist) main.querySelector('.row-artist').textContent = track.artist;

          const eq = document.createElement('div');
          eq.className = 'eq';
          eq.innerHTML = '<span></span><span></span><span></span>';

          row.appendChild(cover);
          row.appendChild(main);
          row.appendChild(eq);

          if (track.local) {
            const del = document.createElement('button');
            del.className = 'row-action';
            del.innerHTML = ICONS.trash;
            del.addEventListener('click', async (e) => {
              e.stopPropagation();
              await idbDelete(track.id);
              if (current === i) {
                audio.pause();
                current = -1;
                miniPlayer.classList.remove('active');
                fullPlayer.classList.remove('active');
              }
              await loadTracks();
            });
            row.appendChild(del);
          }

          row.addEventListener('click', () => playTrack(i));
          container.appendChild(row);
        });
      }

      // ---------- Загрузка библиотеки ----------
      async function loadTracks() {
        let jsonTracks = [];
        try {
          const resp = await fetch('data.json');
          if (resp.ok) jsonTracks = await resp.json();
        } catch (e) {}

        const localTracks = await idbGetAll();
        localTracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));

        allTracks = [
          ...jsonTracks.map(t => ({
            id: t.id, title: t.title, artist: '', coverUrl: null,
            src: t.file_path, local: false
          })),
          ...localTracks.map(t => ({
            id: t.id, title: t.title, artist: t.artist || '', coverUrl: t.coverUrl || null,
            blob: t.blob, src: t.src, audiusId: t.audiusId || null, local: true
          }))
        ];
        render();
      }

      // ---------- Плеер ----------
      function fmtTime(s) {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function playTrack(i) {
        current = i;
        const track = allTracks[i];

        audio.src = track.src || URL.createObjectURL(track.blob);
        const label = track.artist ? track.artist + ' — ' + track.title : track.title;

        miniTitle.textContent = label;
        miniCover.innerHTML = coverHTML(track.coverUrl, track.title, 15);
        fpTitle.textContent = track.title || 'Без названия';
        fpArtist.textContent = track.artist || ' ';
        fpCover.innerHTML = coverHTML(track.coverUrl, track.title, 84);

        miniPlayer.classList.add('active');
        applyGlow(track);
        audio.play();
        render();
      }

      function togglePlay() {
        if (current === -1) {
          if (lastOnline) { playOnlineTrack(lastOnline, false); return; }
          if (allTracks.length) playTrack(0);
          return;
        }
        if (audio.paused) audio.play(); else audio.pause();
      }

      function nextIndex() {
        if (allTracks.length < 2) return current;
        if (shuffleOn) {
          let n;
          do { n = Math.floor(Math.random() * allTracks.length); } while (n === current);
          return n;
        }
        return current < allTracks.length - 1 ? current + 1 : 0;
      }

      audio.addEventListener('play', () => {
        playPauseBtn.innerHTML = ICONS.pause;
        miniPlayBtn.innerHTML = ICONS.pauseSm;
      });
      audio.addEventListener('pause', () => {
        playPauseBtn.innerHTML = ICONS.play;
        miniPlayBtn.innerHTML = ICONS.playSm;
      });

      function syncProgress() {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration * 100) + '%';
        miniFill.style.width = pct;
        fpFill.style.width = pct;
        fpCur.textContent = fmtTime(audio.currentTime);
        fpDur.textContent = fmtTime(audio.duration);
      }
      audio.addEventListener('timeupdate', syncProgress);

      audio.addEventListener('ended', () => {
        if (audio.loop) return;
        if (radioOn) { radioNext(); return; }
        if (current >= 0) playTrack(nextIndex());
      });

      playPauseBtn.innerHTML = ICONS.play;
      miniPlayBtn.innerHTML = ICONS.playSm;
      playPauseBtn.addEventListener('click', togglePlay);
      miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (current > 0) playTrack(current - 1);
        else if (allTracks.length) playTrack(allTracks.length - 1);
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (radioOn) { radioNext(); return; }
        if (allTracks.length && current >= 0) playTrack(nextIndex());
      });
      miniNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (radioOn) { radioNext(); return; }
        if (allTracks.length && current >= 0) playTrack(nextIndex());
      });

      function seekFromEvent(e, el) {
        if (!audio.duration) return;
        const rect = el.getBoundingClientRect();
        audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
      }
      fpTrackBar.addEventListener('click', (e) => seekFromEvent(e, fpTrackBar));

      miniPlayer.addEventListener('click', () => fullPlayer.classList.add('active'));
      document.getElementById('fpCloseBtn').addEventListener('click', () => fullPlayer.classList.remove('active'));

      // ---------- Добавление файлов ----------
      const fileInput = document.getElementById('fileInput');
      addBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async () => {
        const okExt = ['mp3', 'm4a', 'aac', 'ogg', 'oga', 'wav', 'flac', 'opus', 'mp4'];
        for (const file of fileInput.files) {
          const ext = (file.name.split('.').pop() || '').toLowerCase();
          const isAudio = (file.type && file.type.startsWith('audio/')) || okExt.includes(ext);
          if (!isAudio) {
            alert('Файл «' + file.name + '» не похож на аудио — пропущен.');
            continue;
          }
          const tags = await readTags(file);
          await idbPut({
            id: Date.now() + Math.random(),
            addedAt: Date.now(),
            title: tags.title || file.name.replace(/\.[^.]+$/, ''),
            artist: tags.artist || '',
            coverUrl: pictureToDataURL(tags.picture),
            blob: file
          });
        }
        fileInput.value = '';
        await loadTracks();
      });

      // ---------- Старт ----------
      loadTracks();
      setTab('lib');
    })();
  </script>
</body>
