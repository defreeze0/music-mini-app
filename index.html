<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f0f10);
      --card-bg: var(--tg-theme-secondary-bg-color, #1a1a1d);
      --text-color: var(--tg-theme-text-color, #f5f5f7);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #2f80ed);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --stroke: rgba(255, 255, 255, 0.07);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px 20px 130px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header { width: 100%; max-width: 600px; margin-bottom: 24px; }

    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle { color: var(--hint-color); margin: 0; font-size: 14px; }

    .actions { display: flex; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 28px; }

    .add-btn {
      flex-grow: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .add-btn:active { transform: scale(0.98); opacity: 0.85; }

    .ghost-btn {
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      color: var(--hint-color);
      border: 1px solid var(--stroke);
      padding: 0 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .ghost-btn:active { color: var(--text-color); border-color: rgba(255,255,255,0.2); }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
      position: relative;
    }
    .card.playing { border-color: var(--button-color); }
    .card:active { transform: scale(0.97); }

    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-cover svg { opacity: 0.35; }

    /* Эквалайзер на играющей карточке */
    .eq {
      position: absolute; right: 8px; bottom: 8px;
      display: none; align-items: flex-end; gap: 2px;
      width: 18px; height: 14px;
    }
    .card.playing .eq { display: flex; }
    .eq span {
      width: 3px; background: #fff; border-radius: 1px;
      animation: eq 0.9s ease-in-out infinite;
    }
    .eq span:nth-child(1) { height: 60%; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 100%; animation-delay: 0.25s; }
    .eq span:nth-child(3) { height: 40%; animation-delay: 0.5s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .title {
      font-weight: 600; font-size: 13.5px; line-height: 1.3;
      color: var(--text-color);
      word-break: break-word;
      min-height: 36px;
      display: flex; align-items: center;
    }

    .artist {
      font-size: 11.5px;
      color: var(--hint-color);
      margin: 2px 0 8px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .delete-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(255, 69, 58, 0.12);
      color: #ff6961;
      border: none;
      padding: 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .delete-btn:active { background: rgba(255, 69, 58, 0.25); }

    .empty {
      color: var(--hint-color);
      text-align: center;
      font-size: 14px;
      padding: 32px 20px;
      border: 1px dashed var(--stroke);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      line-height: 1.5;
    }

    /* Плеер */
    .player-container {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--stroke);
      border-radius: 20px 20px 0 0;
      padding: 12px 16px 18px 16px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateY(100%);
      transition: all 0.3s ease;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
    }
    .player-container.active { opacity: 1; visibility: visible; transform: translateY(0); }

    .player-row {
      display: flex; align-items: center; gap: 10px;
      max-width: 640px; margin: 0 auto;
    }

    .player-cover {
      width: 48px; height: 48px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .player-cover img { width: 100%; height: 100%; object-fit: cover; }
    .player-cover svg { opacity: 0.35; }

    .player-info { flex-grow: 1; min-width: 0; }
    .player-title-row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      margin-bottom: 8px;
    }
    .player-title {
      font-size: 13.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .time-label { font-size: 11px; color: var(--hint-color); flex-shrink: 0; font-variant-numeric: tabular-nums; }

    .progress-bar {
      height: 18px;
      display: flex; align-items: center;
      cursor: pointer;
    }
    .progress-track { height: 4px; width: 100%; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--button-color); border-radius: 2px; }

    .ctrl-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-color);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.08); }
    .ctrl-btn.active { color: var(--button-color); }

    .play-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .play-btn:active { transform: scale(0.94); }

    #mainAudio { display: none; }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="greeting">Музыка</h1>
    <p class="subtitle">Ваша библиотека</p>
  </div>

  <div class="actions">
    <button class="add-btn" id="addBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      Добавить трек
    </button>
    <button class="ghost-btn" id="openBrowserBtn">В браузере</button>
  </div>
  <input type="file" id="fileInput" multiple />

  <div id="app" class="cards-container"></div>

  <!-- Плеер -->
  <div class="player-container" id="player">
    <div class="player-row">
      <button class="ctrl-btn" id="shuffleBtn" title="Перемешать">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zM18 6v12l-8.5-6z"/></svg>
      </button>
      <div class="player-cover" id="playerCover"></div>
      <div class="player-info">
        <div class="player-title-row">
          <span class="player-title" id="playerTitle">—</span>
          <span class="time-label" id="timeLabel">0:00</span>
        </div>
        <div class="progress-bar" id="progressBar">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
      <button class="play-btn" id="playPauseBtn"></button>
      <button class="ctrl-btn" id="nextBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" title="Повтор трека">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
  </div>

  <audio id="mainAudio"></audio>

  <script>
    (function () {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // ---------- Безопасное хранилище (в некоторых вебвью localStorage блокируется) ----------
      const storage = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      // ---------- Приветствие ----------
      try {
        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user && user.first_name) {
          document.getElementById('greeting').textContent = 'Привет, ' + user.first_name;
        }
      } catch (e) {}

      // ---------- SVG-иконки ----------
      const ICONS = {
        play: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
        note: '<svg viewBox="0 0 24 24" width="34" height="34" fill="#fff"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>'
      };

      const audio = document.getElementById('mainAudio');
      const container = document.getElementById('app');
      const player = document.getElementById('player');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playerTitle = document.getElementById('playerTitle');
      const playerCover = document.getElementById('playerCover');
      const timeLabel = document.getElementById('timeLabel');
      const progressFill = document.getElementById('progressFill');
      const progressBar = document.getElementById('progressBar');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const repeatBtn = document.getElementById('repeatBtn');

      let allTracks = [];
      let current = -1;

      // ---------- Режимы плеера ----------
      let shuffleOn = storage.get('shuffleOn') === '1';
      let repeatOn = storage.get('repeatOn') === '1';
      audio.loop = repeatOn;
      updateModeButtons();

      function updateModeButtons() {
        shuffleBtn.classList.toggle('active', shuffleOn);
        repeatBtn.classList.toggle('active', repeatOn);
      }

      shuffleBtn.addEventListener('click', () => {
        shuffleOn = !shuffleOn;
        storage.set('shuffleOn', shuffleOn ? '1' : '0');
        updateModeButtons();
      });

      repeatBtn.addEventListener('click', () => {
        repeatOn = !repeatOn;
        storage.set('repeatOn', repeatOn ? '1' : '0');
        audio.loop = repeatOn;
        updateModeButtons();
      });

      // ---------- IndexedDB ----------
      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('musicApp', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGetAll() {
        const db = await openDB();
        return new Promise((resolve) => {
          const req = db.transaction('tracks').objectStore('tracks').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }

      async function idbPut(track) {
        const db = await openDB();
        db.transaction('tracks', 'readwrite').objectStore('tracks').put(track);
      }

      async function idbDelete(id) {
        const db = await openDB();
        db.transaction('tracks', 'readwrite').objectStore('tracks').delete(id);
      }

      // ---------- Теги из аудиофайла ----------
      function readTags(file) {
        return new Promise((resolve) => {
          if (!window.jsmediatags) { resolve({}); return; }
          try {
            window.jsmediatags.read(file, {
              onSuccess: (result) => resolve(result.tags || {}),
              onError: () => resolve({})
            });
          } catch (e) { resolve({}); }
        });
      }

      function pictureToDataURL(pic) {
        if (!pic || !pic.data) return null;
        let binary = '';
        const bytes = new Uint8Array(pic.data);
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return 'data:' + (pic.format || 'image/jpeg') + ';base64,' + btoa(binary);
      }

      // ---------- Градиент-обложка по названию ----------
      function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
        return Math.abs(h);
      }

      function gradientFor(title) {
        const h = hashCode(title || 'track') % 360;
        return 'linear-gradient(135deg, hsl(' + h + ', 55%, 40%), hsl(' + ((h + 50) % 360) + ', 55%, 25%))';
      }

      function setCoverContent(el, track) {
        el.innerHTML = '';
        if (track.coverUrl) {
          const img = document.createElement('img');
          img.src = track.coverUrl;
          img.alt = '';
          el.appendChild(img);
        } else {
          el.style.background = gradientFor(track.title);
          el.innerHTML = ICONS.note;
        }
      }

      // ---------- Рендер списка ----------
      function render() {
        container.innerHTML = '';
        if (allTracks.length === 0) {
          container.innerHTML = '<div class="empty">Библиотека пуста.<br>Добавьте треки, чтобы начать слушать.</div>';
          return;
        }
        allTracks.forEach((track, i) => {
          const card = document.createElement('div');
          card.className = 'card' + (i === current ? ' playing' : '');

          const cover = document.createElement('div');
          cover.className = 'card-cover';
          setCoverContent(cover, track);
          cover.insertAdjacentHTML('beforeend', '<div class="eq"><span></span><span></span><span></span></div>');

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = track.title || 'Без названия';

          card.appendChild(cover);
          card.appendChild(title);

          if (track.artist) {
            const artist = document.createElement('div');
            artist.className = 'artist';
            artist.textContent = track.artist;
            card.appendChild(artist);
          }

          if (track.local) {
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2h4v2H4V6h4l1-2z"/></svg> Удалить';
            del.addEventListener('click', async (e) => {
              e.stopPropagation();
              await idbDelete(track.id);
              if (current === i) {
                audio.pause();
                current = -1;
                player.classList.remove('active');
              }
              await loadTracks();
            });
            card.appendChild(del);
          }

          card.addEventListener('click', () => playTrack(i));
          container.appendChild(card);
        });
      }

      // ---------- Загрузка треков ----------
      async function loadTracks() {
        let jsonTracks = [];
        try {
          const resp = await fetch('data.json');
          if (resp.ok) jsonTracks = await resp.json();
        } catch (e) {}

        const localTracks = await idbGetAll();
        localTracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));

        allTracks = [
          ...jsonTracks.map(t => ({
            id: t.id, title: t.title, artist: '', coverUrl: null,
            src: t.file_path, local: false
          })),
          ...localTracks.map(t => ({
            id: t.id, title: t.title, artist: t.artist || '', coverUrl: t.coverUrl || null,
            blob: t.blob, local: true
          }))
        ];
        render();
      }

      // ---------- Плеер ----------
      function fmtTime(s) {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function playTrack(i) {
        current = i;
        const track = allTracks[i];

        audio.src = track.src || URL.createObjectURL(track.blob);
        playerTitle.textContent = track.artist ? track.artist + ' — ' + track.title : track.title;
        setCoverContent(playerCover, track);
        player.classList.add('active');
        audio.play();
        render();
      }

      function togglePlay() {
        if (current === -1) { if (allTracks.length) playTrack(0); return; }
        if (audio.paused) audio.play(); else audio.pause();
      }

      function nextIndex() {
        if (allTracks.length < 2) return current;
        if (shuffleOn) {
          let next;
          do { next = Math.floor(Math.random() * allTracks.length); } while (next === current);
          return next;
        }
        return current < allTracks.length - 1 ? current + 1 : 0;
      }

      audio.addEventListener('play', () => { playPauseBtn.innerHTML = ICONS.pause; });
      audio.addEventListener('pause', () => { playPauseBtn.innerHTML = ICONS.play; });

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
          timeLabel.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
        }
      });

      audio.addEventListener('ended', () => {
        if (audio.loop) return;
        playTrack(nextIndex());
      });

      playPauseBtn.addEventListener('click', togglePlay);
      playPauseBtn.innerHTML = ICONS.play;

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (current > 0) playTrack(current - 1);
        else if (allTracks.length) playTrack(allTracks.length - 1);
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (allTracks.length) playTrack(nextIndex());
      });

      progressBar.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = progressBar.getBoundingClientRect();
        audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
      });

      // ---------- Добавление треков ----------
      const fileInput = document.getElementById('fileInput');
      document.getElementById('addBtn').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async () => {
        const okExt = ['mp3', 'm4a', 'aac', 'ogg', 'oga', 'wav', 'flac', 'opus', 'mp4'];
        for (const file of fileInput.files) {
          const ext = (file.name.split('.').pop() || '').toLowerCase();
          const isAudio = (file.type && file.type.startsWith('audio/')) || okExt.includes(ext);
          if (!isAudio) {
            alert('Файл «' + file.name + '» не похож на аудио — пропущен.');
            continue;
          }
          const tags = await readTags(file);
          const fallbackTitle = file.name.replace(/\.[^.]+$/, '');
          await idbPut({
            id: Date.now() + Math.random(),
            addedAt: Date.now(),
            title: tags.title || fallbackTitle,
            artist: tags.artist || '',
            coverUrl: pictureToDataURL(tags.picture),
            blob: file
          });
        }
        fileInput.value = '';
        await loadTracks();
      });

      // ---------- Открытие в браузере ----------
      document.getElementById('openBrowserBtn').addEventListener('click', () => {
        tg.openLink('https://defreeze0.github.io/music-mini-app/');
      });

      // ---------- Старт ----------
      loadTracks();
    })();
  </script>
</body>
</html>
