<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --tg-theme-bg-color: #0e0e0e;
      --tg-theme-text-color: #ffffff;
      --tg-theme-hint-color: #8e8e93;
      --tg-theme-button-color: #2ea6ff;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-secondary-bg-color: #181818;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .greeting {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 700;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 14px;

      background: var(--tg-theme-secondary-bg-color);
      border-radius: 16px;

      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .cover-placeholder {
      width: 58px;
      height: 58px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #242424;

      font-size: 28px;
    }

    .title {
      flex: 1;

      min-width: 0;

      font-size: 16px;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card button {
      border: none;
      border-radius: 10px;

      padding: 10px 15px;

      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: opacity 0.2s ease;
    }

    .card button:active {
      opacity: 0.7;
    }

    .status {
      padding: 20px 10px;

      color: var(--tg-theme-hint-color);

      text-align: center;
      font-size: 15px;
    }

    .error {
      color: #ff6b6b;
    }

    .spinner {
      width: 24px;
      height: 24px;

      margin: 0 auto 10px;

      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--tg-theme-button-color);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="greeting" class="greeting">
      Привет, друг!
    </div>

    <div id="app" class="cards-container">
      <div class="status">
        <div class="spinner"></div>
        Загрузка...
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();

    const greetingEl = document.getElementById('greeting');
    const container = document.getElementById('app');

    /*
     * Приветствие пользователя Telegram
     */
    const user = tg.initDataUnsafe?.user;

    if (user && user.first_name) {
      greetingEl.textContent = 'Привет, ' + user.first_name + '!';
    } else {
      greetingEl.textContent = 'Привет, друг!';
    }

    /*
     * Загрузка списка треков
     */
    fetch('./data.json')
      .then(function(response) {

        if (!response.ok) {
          throw new Error(
            'Не удалось загрузить data.json. HTTP статус: ' + response.status
          );
        }

        return response.json();
      })

      .then(function(tracks) {

        /*
         * Проверяем, что JSON действительно содержит массив
         */
        if (!Array.isArray(tracks) || tracks.length === 0) {
          throw new Error('Файл data.json пустой или имеет неправильный формат');
        }

        /*
         * Очищаем "Загрузка..."
         */
        container.innerHTML = '';

        /*
         * Создаём карточки
         */
        tracks.forEach(function(track) {

          const card =


nt.createElement('div');
          card.className = 'card';

          /*
           * Обложка
           */
          const cover = document.createElement('div');
          cover.className = 'cover-placeholder';
          cover.textContent = track.cover || '🎵';

          /*
           * Название
           */
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = track.title || 'Без названия';

          /*
           * Кнопка
           */
          const button = document.createElement('button');
          button.textContent = 'Слушать';

          /*
           * Обработка нажатия
           */
          button.onclick = function() {

            /*
             * Проверяем путь
             */
            if (
              !track.file_path ||
              typeof track.file_path !== 'string' ||
              track.file_path.trim() === ''
            ) {
              alert('Ошибка: путь к файлу не указан');
              return;
            }

            /*
             * Убираем случайные пробелы
             */
            const filePath = track.file_path.trim();

            /*
             * Проверяем, что путь похож на путь к аудиофайлу
             */
            if (
              !filePath.startsWith('audio/') ||
              !filePath.toLowerCase().endsWith('.mp3')
            ) {
              console.error(
                'Некорректный путь к аудиофайлу:',
                filePath
              );

              alert('Ошибка: путь к файлу не указан');
              return;
            }

            /*
             * Превращаем относительный путь
             *
             * audio/track1.mp3
             *
             * в полный URL, например:
             *
             * https://defreeze0.github.io/music-mini-app/audio/track1.mp3
             *
             * Это особенно удобно для проверки GitHub Pages.
             */
            const fullUrl = new URL(
              filePath,
              document.baseURI
            ).href;

            /*
             * Главная проверка для отладки.
             *
             * Открой консоль браузера и посмотри,
             * какой именно URL здесь выводится.
             */
            console.log(
              'Открываем аудиофайл:',
              fullUrl
            );

            /*
             * Открываем ссылку через Telegram WebApp
             */
            tg.openLink(fullUrl);
          };

          /*
           * Собираем карточку
           */
          card.appendChild(cover);
          card.appendChild(title);
          card.appendChild(button);

          container.appendChild(card);
        });
      })

      .catch(function(error) {

        /*
         * Выводим настоящую ошибку в консоль
         */
        console.error(
          'Ошибка загрузки списка треков:',
          error
        );

        /*
         * Показываем пользователю понятное сообщение
         */
        container.innerHTML = '';

        const errorMessage = document.createElement('div');

        errorMessage.className = 'status error';

        errorMessage.textContent =
          'Ошибка загрузки списка треков. Проверьте файл data.json';

        container.appendChild(errorMessage);
      });
  </script>

</body>
