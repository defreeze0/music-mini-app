<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Музыка в Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f0f2f5;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 { text-align: center; color: #2481cc; }
      p { text-align: center; color: #666; }
      
      .tracks-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      
      .track-card {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      
      .track-cover {
        width: 100%;
        height: 150px;
        background-color: #ddd;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        margin-bottom: 10px;
        border-radius: 8px;
      }
      
      .track-title { font-weight: bold; margin-bottom: 4px; }
      .track-artist { color: #888; font-size: 0.9em; }
