<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0b0b0d);
      --surface: var(--tg-theme-secondary-bg-color, #161618);
      --text: var(--tg-theme-text-color, #f5f5f7);
      --hint: var(--tg-theme-hint-color, #7c7c82);
      --accent: var(--tg-theme-button-color, #4f8cff);
      --on-accent: var(--tg-theme-button-text-color, #ffffff);
      --stroke: rgba(255, 255, 255, 0.06);
      --glow: rgba(80, 120, 255, 0);
      --glow-soft: rgba(80, 120, 255, 0);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 96px 0;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 0 20px; }

    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
    .sub { margin: 4px 0 0 0; color: var(--hint); font-size: 13.5px; }

    .search-box { margin-top: 22px; position: relative; }
    .search-box svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--hint); pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: rgba(255, 255, 255, 0.18); }
    .search-input::placeholder { color: var(--hint); }

    .add-btn {
      margin-top: 14px;
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .add-btn:active { transform: scale(0.98); opacity: 0.85; }

    .lib-tools { display: flex; gap: 8px; margin-top: 10px; }
    .tool-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--stroke);
      color: var(--hint);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:active { color: var(--text); }

    .list { margin-top: 10px; }

    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .row:hover { background: var(--surface); }
    .row:active { background: var(--surface); }
    .row.playing .row-title { color: var(--accent); }

    .cover-art {
      width: 52px; height: 52px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .cover-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-art .letter {
      font-size: 18px; font-weight: 700;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    .row-main { flex-grow: 1; min-width: 0; }
    .row-title {
      font-size: 14.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-artist {
      font-size: 12.5px; color: var(--hint);
      margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .eq {
      display: none; align-items: flex-end; gap: 2px;
      width: 16px; height: 14px; flex-shrink: 0;
    }
    .row.playing .eq { display: flex; }
    .eq span {
      width: 3px; background: var(--accent); border-radius: 1px;
      animation: eq 0.9s ease-in-out infinite;
    }
    .eq span:nth-child(1) { height: 55%; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 100%; animation-delay: 0.25s; }
    .eq span:nth-child(3) { height: 40%; animation-delay: 0.5s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .row-action {
      background: transparent;
      border: none;
      color: var(--hint);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex; align-items: center;
      transition: color 0.2s;
    }
    .row-action:hover { color: var(--text); }

    .empty {
      margin-top: 14px;
      color: var(--hint);
      font-size: 13.5px;
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed var(--stroke);
      border-radius: 16px;
      line-height: 1.6;
    }

    /* ---------- Мини-плеер ---------- */
    .mini-player {
      position: fixed;
      left: 12px; right: 12px; bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 10px 10px;
      display: flex; align-items: center; gap: 6px;
      z-index: 90;
      opacity: 0; visibility: hidden; transform: translateY(20px);
      transition: all 0.25s ease, box-shadow 0.6s ease;
      box-shadow: 0 10px 30px var(--glow-soft, rgba(0, 0, 0, 0.4));
      cursor: pointer;
      touch-action: pan-y;
    }
    .mini-player.active { opacity: 1; visibility: visible; transform: translateY(0); }

    .mini-cover {
      width: 42px; height: 42px;
      border-radius: 9px;
      overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-cover img { width: 100%; height: 100%; object-fit: cover; }
    .mini-cover .letter { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.55); width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

    .mini-main { flex-grow: 1; min-width: 0; }
    .mini-title {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-bar {
      height: 3px; margin-top: 7px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px; overflow: hidden;
    }
    .mini-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }

    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    .icon-btn:active { background: rgba(255,255,255,0.08); }
    .icon-btn.accented { color: var(--accent); }

    .icon-btn.sm { width: 30px; height: 30px; }
    .icon-btn.sm svg { width: 16px; height: 16px; }

    .play-round {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .play-round:active { transform: scale(0.93); }

    /* ---------- Полноэкранный плеер ---------- */
    .full-player {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 130% 55% at 50% -8%, var(--glow), transparent 65%),
        var(--bg);
      z-index: 200;
      display: flex; flex-direction: column;
      padding: 20px 24px calc(28px + env(safe-area-inset-bottom)) 24px;
      opacity: 0; visibility: hidden; transform: translateY(30px);
      transition: all 0.28s ease, background 0.6s ease;
      overflow: hidden;
    }
    .full-player.active { opacity: 1; visibility: visible; transform: translateY(0); }

    #vizCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .full-player.active #vizCanvas { opacity: 1; }
    .full-player > *:not(#vizCanvas) { position: relative; z-index: 1; }

    .fp-top { display: flex; align-items: center; justify-content: space-between; }
    .fp-label { color: var(--hint); font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
    .speed-btn {
      background: transparent;
      border: 1px solid var(--stroke);
      color: var(--hint);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .speed-btn.accented { color: var(--accent); border-color: rgba(255,255,255,0.15); }

    .fp-cover {
      width: min(72vw, 280px);
      aspect-ratio: 1;
      border-radius: 20px;
      margin: 7vh auto 0 auto;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 20px 60px var(--glow-soft, rgba(0, 0, 0, 0.5));
      flex-shrink: 0;
      transition: box-shadow 0.6s ease;
      position: relative;
    }
    .fp-cover img { width: 100%; height: 100%; object-fit: cover; }
    .fp-cover .letter { font-size: 84px; font-weight: 700; color: rgba(255,255,255,0.5); width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

    .fp-meta { margin-top: auto; }
    .fp-title { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .fp-artist { font-size: 14px; color: var(--hint); margin-top: 4px; }

    .fp-progress { margin-top: 20px; }
    .fp-track { height: 20px; display: flex; align-items: center; cursor: pointer; }
    .fp-line { height: 5px; width: 100%; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
    .fp-line-fill { height: 100%; width: 0%; background: var(--text); border-radius: 3px; }
    .fp-times {
      display: flex; justify-content: space-between;
      font-size: 11.5px; color: var(--hint); margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .fp-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 16px;
    }
    .fp-controls .group { display: flex; gap: 4px; }
    .fp-play {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .fp-play:active { transform: scale(0.94); }

    #mainAudio, #shadowAudio { display: none; }
    #fileInput, #importInput { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="greeting">Музыка</h1>
    <p class="sub">Ваша библиотека</p>

    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Поиск по трекам" />
    </div>

    <button class="add-btn" id="addBtn">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      Добавить трек
    </button>

    <div class="lib-tools">
      <button class="tool-btn" id="exportBtn">Экспорт библиотеки</button>
      <button class="tool-btn" id="importBtn">Импорт</button>
    </div>

    <input type="file" id="fileInput" multiple />
    <input type="file" id="importInput" accept=".json,application/json" />

    <div id="app" class="list"></div>
  </div>

  <!-- Мини-плеер -->
  <div class="mini-player" id="miniPlayer">
    <div class="mini-cover" id="miniCover"></div>
    <div class="mini-main" id="miniMain">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-bar"><div class="mini-fill" id="miniFill"></div></div>
    </div>
    <button class="icon-btn sm shuffle-toggle" title="Перемешать">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
    <button class="play-round" id="miniPlayBtn"></button>
    <button class="icon-btn sm repeat-toggle" title="Повтор">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
    <button class="icon-btn sm" id="miniNextBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>

  <!-- Полноэкранный плеер -->
  <div class="full-player" id="fullPlayer">
    <canvas id="vizCanvas"></canvas>
    <div class="fp-top">
      <span class="fp-label">Сейчас играет</span>
      <button class="speed-btn" id="speedBtn">1×</button>
      <button class="icon-btn" id="shareBtn" title="Поделиться">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
      </button>
      <button class="icon-btn" id="fpCloseBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
    </div>

    <div class="fp-cover" id="fpCover"></div>

    <div class="fp-meta">
      <div class="fp-title" id="fpTitle">—</div>
      <div class="fp-artist" id="fpArtist"></div>

      <div class="fp-progress">
        <div class="fp-track" id="fpTrackBar">
          <div class="fp-line"><div class="fp-line-fill" id="fpFill"></div></div>
        </div>
        <div class="fp-times">
          <span id="fpCur">0:00</span>
          <span id="fpDur">0:00</span>
        </div>
      </div>

      <div class="fp-controls">
        <div class="group">
          <button class="icon-btn shuffle-toggle" id="shuffleBtn">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>
          <button class="icon-btn cross-toggle" id="crossBtn" title="Кроссфейд">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M3 7h13.2l-2.6-2.6L15 3l5 5-5 5-1.4-1.4L16.2 9H3V7zm18 10H7.8l2.6 2.6L9 21l-5-5 5-5 1.4 1.4L7.8 15H21v2z"/></svg>
          </button>
        </div>
        <div class="group">
          <button class="icon-btn" id="prevBtn">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zM18 6v12l-8.5-6z"/></svg>
          </button>
          <button class="fp-play" id="playPauseBtn"></button>
          <button class="icon-btn" id="nextBtn">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
          </button>
        </div>
        <div class="group">
          <button class="icon-btn repeat-toggle" id="repeatBtn">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <audio id="mainAudio"></audio>
  <audio id="shadowAudio"></audio>

  <script>
    (function () {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      const storage = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      try {
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u && u.first_name) document.getElementById('greeting').textContent = 'Привет, ' + u.first_name;
      } catch (e) {}

      const ICONS = {
        play: '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
        playSm: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
        pauseSm: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2h4v2H4V6h4l1-2z"/></svg>'
      };

      const audioA = document.getElementById('mainAudio');
      const audioB = document.getElementById('shadowAudio');
      let audio = audioA;

      const container = document.getElementById('app');
      const searchInput = document.getElementById('searchInput');
      const importInput = document.getElementById('importInput');

      const miniPlayer = document.getElementById('miniPlayer');
      const miniCover = document.getElementById('miniCover');
      const miniTitle = document.getElementById('miniTitle');
      const miniFill = document.getElementById('miniFill');
      const miniPlayBtn = document.getElementById('miniPlayBtn');
      const miniNextBtn = document.getElementById('miniNextBtn');

      const fullPlayer = document.getElementById('fullPlayer');
      const fpCover = document.getElementById('fpCover');
      const fpTitle = document.getElementById('fpTitle');
      const fpArtist = document.getElementById('fpArtist');
      const fpFill = document.getElementById('fpFill');
      const fpTrackBar = document.getElementById('fpTrackBar');
      const fpCur = document.getElementById('fpCur');
      const fpDur = document.getElementById('fpDur');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const speedBtn = document.getElementById('speedBtn');
      const crossBtn = document.getElementById('crossBtn');
      const shareBtn = document.getElementById('shareBtn');
      const vizCanvas = document.getElementById('vizCanvas');

      const shuffleBtns = document.querySelectorAll('.shuffle-toggle');
      const repeatBtns = document.querySelectorAll('.repeat-toggle');

      let allTracks = [];
      let current = -1;

      let shuffleOn = storage.get('shuffleOn') === '1';
      let repeatOn = storage.get('repeatOn') === '1';
      let crossOn = storage.get('crossOn') !== '0';
      audioA.loop = repeatOn;
      let curRate = parseFloat(storage.get('rate') || '1') || 1;
      updateModeButtons();

      function updateModeButtons() {
        shuffleBtns.forEach(b => b.classList.toggle('accented', shuffleOn));
        repeatBtns.forEach(b => b.classList.toggle('accented', repeatOn));
        crossBtn.classList.toggle('accented', crossOn);
        speedBtn.classList.toggle('accented', curRate !== 1);
        speedBtn.textContent = (curRate + '').replace('.', ',') + '×';
      }

      function applyRate() {
        audioA.playbackRate = curRate;
        audioB.playbackRate = curRate;
      }
      applyRate();

      shuffleBtns.forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        shuffleOn = !shuffleOn;
        storage.set('shuffleOn', shuffleOn ? '1' : '0');
        updateModeButtons();
      }));

      repeatBtns.forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        repeatOn = !repeatOn;
        storage.set('repeatOn', repeatOn ? '1' : '0');
        audioA.loop = repeatOn;
        audioB.loop = repeatOn;
        updateModeButtons();
      }));

      crossBtn.addEventListener('click', () => {
        crossOn = !crossOn;
        storage.set('crossOn', crossOn ? '1' : '0');
        updateModeButtons();
      });

      const RATES = [0.75, 1, 1.25, 1.5, 2];
      speedBtn.addEventListener('click', () => {
        const idx = RATES.indexOf(curRate);
        curRate = RATES[(idx + 1) % RATES.length];
        storage.set('rate', curRate);
        applyRate();
        updateModeButtons();
      });

      // ---------- IndexedDB ----------
      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('musicApp', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGetAll() {
        const db = await openDB();
        return new Promise((resolve) => {
          const req = db.transaction('tracks').objectStore('tracks').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }

      async function idbPut(track) {
        const db = await openDB();
        db.transaction('tracks', 'readwrite').objectStore('tracks').put(track);
      }

      async function idbDelete(id) {
        const db = await openDB();
        db.transaction('tracks', 'readwrite').objectStore('tracks').delete(id);
      }

      // ---------- Теги ----------
      function readTags(file) {
        return new Promise((resolve) => {
          if (!window.jsmediatags) { resolve({}); return; }
          try {
            window.jsmediatags.read(file, {
              onSuccess: (r) => resolve(r.tags || {}),
              onError: () => resolve({})
            });
          } catch (e) { resolve({}); }
        });
      }

      function pictureToDataURL(pic) {
        if (!pic || !pic.data) return null;
        let binary = '';
        const bytes = new Uint8Array(pic.data);
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return 'data:' + (pic.format || 'image/jpeg') + ';base64,' + btoa(binary);
      }

      // ---------- Обложка ----------
      function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
        return Math.abs(h);
      }

      function coverHTML(url, title, letterSize) {
        if (url) return '<img src="' + url + '" alt="" />';
        const h = hashCode(title || 'track') % 360;
        const bg = 'background: radial-gradient(circle at 30% 25%, hsl(' + h + ', 30%, 22%), hsl(' + h + ', 28%, 10%));';
        const letter = (title || '?').trim().charAt(0).toUpperCase();
        return '<div class="letter" style="' + bg + ' font-size:' + letterSize + 'px;">' + letter + '</div>';
      }

      // ---------- Подсветка под цвет обложки ----------
      let glowColor = [79, 140, 255];

      function applyGlow(coverUrl, title) {
        if (coverUrl) {
          extractColor(coverUrl).then(rgb => { if (rgb) setGlow(rgb.r, rgb.g, rgb.b); });
        } else {
          const h = hashCode(title || 'track') % 360;
          const rgb = hslToRgb(h / 360, 0.35, 0.35);
          setGlow(rgb.r, rgb.g, rgb.b);
        }
      }

      function setGlow(r, g, b) {
        glowColor = [r, g, b];
        document.documentElement.style.setProperty('--glow', 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
        document.documentElement.style.setProperty('--glow-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
      }

      function extractColor(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            try {
              const c = document.createElement('canvas');
              c.width = c.height = 20;
              const ctx = c.getContext('2d');
              ctx.drawImage(img, 0, 0, 20, 20);
              const d = ctx.getImageData(0, 0, 20, 20).data;
              let r = 0, g = 0, b = 0, n = 0;
              for (let i = 0; i < d.length; i += 4) {
                if (d[i + 3] > 128) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
              }
              if (!n) { resolve(null); return; }
              resolve({ r: Math.round(r / n), g: Math.round(g / n), b: Math.round(b / n) });
            } catch (e) { resolve(null); }
          };
          img.onerror = () => resolve(null);
          img.src = url;
        });
      }

      function hslToRgb(h, s, l) {
        const a = s * Math.min(l, 1 - l);
        const f = (n) => {
          const k = (n + h * 12) % 12;
          return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))));
        };
        return { r: f(0), g: f(8), b: f(4) };
      }

      // ---------- Веб-аудио: граф для визуализатора ----------
      let actx = null, analyser = null, dataArr = null;

      function ensureAudioGraph() {
        if (actx || (!window.AudioContext && !window.webkitAudioContext)) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          actx = new Ctx();
          analyser = actx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.82;
          const srcA = actx.createMediaElementSource(audioA);
          const srcB = actx.createMediaElementSource(audioB);
          srcA.connect(analyser);
          srcB.connect(analyser);
          analyser.connect(actx.destination);
          dataArr = new Uint8Array(analyser.frequencyBinCount);
        } catch (e) {
          actx = null; analyser = null;
        }
      }

      function resumeAudioGraph() {
        if (actx && actx.state === 'suspended') actx.resume();
      }

      // ---------- Визуализатор ----------
      let rafId = null;

      function startViz() {
        stopViz();
        const loop = () => {
          rafId = requestAnimationFrame(loop);
          drawViz();
        };
        rafId = requestAnimationFrame(loop);
      }

      function stopViz() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      }

      function drawViz() {
        if (!fullPlayer.classList.contains('active')) { stopViz(); return; }

        const dpr = window.devicePixelRatio || 1;
        const w = vizCanvas.clientWidth, h = vizCanvas.clientHeight;
        if (vizCanvas.width !== w * dpr || vizCanvas.height !== h * dpr) {
          vizCanvas.width = w * dpr;
          vizCanvas.height = h * dpr;
        }
        const ctx = vizCanvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const rect = fpCover.getBoundingClientRect();
        const vr = vizCanvas.getBoundingClientRect();
        const cx = rect.left + rect.width / 2 - vr.left;
        const cy = rect.top + rect.height / 2 - vr.top;
        const r0 = rect.width / 2 + 14;

        const playing = !audio.paused && !audio.ended;
        const N = 56;
        const bars = new Array(N).fill(0);

        if (analyser && dataArr) {
          analyser.getByteFrequencyData(dataArr);
          let allZero = true;
          for (let i = 0; i < dataArr.length; i++) if (dataArr[i] > 2) { allZero = false; break; }
          if (!allZero) {
            for (let i = 0; i < N; i++) {
              const bin = Math.floor(i / N * dataArr.length);
              bars[i] = dataArr[bin] / 255;
            }
          } else if (playing) {
            const t = performance.now();
            for (let i = 0; i < N; i++) {
              bars[i] = (Math.sin(t / 260 + i * 0.55) * 0.5 + 0.5) * 0.55;
            }
          }
        } else if (playing) {
          const t = performance.now();
          for (let i = 0; i < N; i++) {
            bars[i] = (Math.sin(t / 260 + i * 0.55) * 0.5 + 0.5) * 0.55;
          }
        }

        const [r, g, b] = glowColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (let i = 0; i < N; i++) {
          const ang = (i / N) * Math.PI * 2 - Math.PI / 2;
          const len = 4 + bars[i] * 42;
          const x1 = cx + Math.cos(ang) * r0;
          const y1 = cy + Math.sin(ang) * r0;
          const x2 = cx + Math.cos(ang) * (r0 + len);
          const y2 = cy + Math.sin(ang) * (r0 + len);
          ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (0.25 + bars[i] * 0.75) + ')';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }

      // ---------- Рендер библиотеки ----------
      function render() {
        const q = (searchInput.value || '').trim().toLowerCase();
        const visible = allTracks.filter(t => !q || (t.title + ' ' + (t.artist || '')).toLowerCase().includes(q));

        container.innerHTML = '';
        if (allTracks.length === 0) {
          container.innerHTML = '<div class="empty">Библиотека пуста.<br>Добавьте треки кнопкой выше.</div>';
          return;
        }
        if (visible.length === 0) {
          container.innerHTML = '<div class="empty">Ничего не найдено по запросу «' + q + '».</div>';
          return;
        }

        visible.forEach((track) => {
          const i = allTracks.indexOf(track);
          const row = document.createElement('div');
          row.className = 'row' + (i === current ? ' playing' : '');

          const cover = document.createElement('div');
          cover.className = 'cover-art';
          cover.innerHTML = coverHTML(track.coverUrl, track.title, 18);

          const main = document.createElement('div');
          main.className = 'row-main';
          main.innerHTML =
            '<div class="row-title"></div>' +
            (track.artist ? '<div class="row-artist"></div>' : '');
          main.querySelector('.row-title').textContent = track.title || 'Без названия';
          if (track.artist) main.querySelector('.row-artist').textContent = track.artist;

          const eq = document.createElement('div');
          eq.className = 'eq';
          eq.innerHTML = '<span></span><span></span><span></span>';

          row.appendChild(cover);
          row.appendChild(main);
          row.appendChild(eq);

          if (track.local) {
            const del = document.createElement('button');
            del.className = 'row-action';
            del.innerHTML = ICONS.trash;
            del.addEventListener('click', async (e) => {
              e.stopPropagation();
              await idbDelete(track.id);
              if (current === i) {
                audio.pause();
                current = -1;
                miniPlayer.classList.remove('active');
                fullPlayer.classList.remove('active');
              }
              await loadTracks();
            });
            row.appendChild(del);
          }

          row.addEventListener('click', () => playTrack(i));
          container.appendChild(row);
        });
      }

      // ---------- Загрузка библиотеки ----------
      async function loadTracks() {
        let jsonTracks = [];
        try {
          const resp = await fetch('data.json');
          if (resp.ok) jsonTracks = await resp.json();
        } catch (e) {}

        const localTracks = await idbGetAll();
        localTracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));

        allTracks = [
          ...jsonTracks.map(t => ({
            id: t.id, title: t.title, artist: '', coverUrl: null,
            src: t.file_path, local: false
          })),
          ...localTracks.map(t => ({
            id: t.id, title: t.title, artist: t.artist || '', coverUrl: t.coverUrl || null,
            blob: t.blob, src: t.src, local: true
          }))
        ];
        render();
      }

      // ---------- Плеер ----------
      function fmtTime(s) {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function playTrack(i) {
        current = i;
        const track = allTracks[i];

        ensureAudioGraph();
        resumeAudioGraph();
        audio.src = track.src || URL.createObjectURL(track.blob);
        audio.playbackRate = curRate;
        const label = track.artist ? track.artist + ' — ' + track.title : track.title;

        miniTitle.textContent = label;
        miniCover.innerHTML = coverHTML(track.coverUrl, track.title, 15);
        fpTitle.textContent = track.title || 'Без названия';
        fpArtist.textContent = track.artist || ' ';
        fpCover.innerHTML = coverHTML(track.coverUrl, track.title, 84);

        miniPlayer.classList.add('active');
        applyGlow(track.coverUrl, track.title);
        audio.play();
        render();
      }

      function togglePlay() {
        if (current === -1) {
          if (allTracks.length) playTrack(0);
          return;
        }
        if (audio.paused) audio.play(); else audio.pause();
      }

      function nextIndex() {
        if (allTracks.length < 2) return current;
        if (shuffleOn) {
          let n;
          do { n = Math.floor(Math.random() * allTracks.length); } while (n === current);
          return n;
        }
        return current < allTracks.length - 1 ? current + 1 : 0;
      }

      // ---------- Кроссфейд ----------
      let crossActive = false;
      let crossOld = null;

      function startCrossfade(oldEl) {
        crossActive = true;
        crossOld = oldEl;
        oldEl.volume = 1;
        audio.volume = 0;
        const steps = 30;
        let i = 0;
        const iv = setInterval(() => {
          i++;
          const p = Math.min(1, i / steps);
          oldEl.volume = Math.max(0, 1 - p);
          audio.volume = Math.min(1, p);
          if (i >= steps) {
            clearInterval(iv);
            oldEl.pause();
            oldEl.volume = 1;
            audio.volume = 1;
            crossActive = false;
            crossOld = null;
          }
        }, 100);
      }

      function tryCrossfade() {
        if (!crossOn || crossActive) return;
        if (current < 0 || repeatOn || audio.loop) return;
        if (!audio.duration || audio.duration < 12) return;
        if (audio.duration - audio.currentTime > 3) return;
        const next = nextIndex();
        if (next === current) return;
        const oldEl = audio;
        audio = (audio === audioA) ? audioB : audioA;
        playTrack(next);
        startCrossfade(oldEl);
      }

      // ---------- События аудио ----------
      [audioA, audioB].forEach(el => {
        el.addEventListener('play', () => {
          if (el !== audio) return;
          playPauseBtn.innerHTML = ICONS.pause;
          miniPlayBtn.innerHTML = ICONS.pauseSm;
        });
        el.addEventListener('pause', () => {
          if (el !== audio) return;
          playPauseBtn.innerHTML = ICONS.play;
          miniPlayBtn.innerHTML = ICONS.playSm;
          if (crossOld) crossOld.pause();
        });
        el.addEventListener('timeupdate', () => {
          if (el !== audio) return;
          if (!audio.duration) return;
          const pct = (audio.currentTime / audio.duration * 100) + '%';
          miniFill.style.width = pct;
          fpFill.style.width = pct;
          fpCur.textContent = fmtTime(audio.currentTime);
          fpDur.textContent = fmtTime(audio.duration);
          tryCrossfade();
        });
        el.addEventListener('ended', () => {
          if (el !== audio) return;
          if (audio.loop) return;
          if (current >= 0) playTrack(nextIndex());
        });
      });

      playPauseBtn.innerHTML = ICONS.play;
      miniPlayBtn.innerHTML = ICONS.playSm;
      playPauseBtn.addEventListener('click', togglePlay);
      miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (current > 0) playTrack(current - 1);
        else if (allTracks.length) playTrack(allTracks.length - 1);
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (allTracks.length && current >= 0) playTrack(nextIndex());
      });
      miniNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (allTracks.length && current >= 0) playTrack(nextIndex());
      });

      function seekFromEvent(e, el) {
        if (!audio.duration) return;
        const rect = el.getBoundingClientRect();
        audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
      }
      fpTrackBar.addEventListener('click', (e) => seekFromEvent(e, fpTrackBar));

      function openFull() {
        fullPlayer.classList.add('active');
        ensureAudioGraph();
        resumeAudioGraph();
        startViz();
      }

      // ---------- Свайп по мини-плееру ----------
      let touchStart = null;
      let swiped = false;

      miniPlayer.addEventListener('touchstart', (e) => {
        if (e.target.closest('button')) return;
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        swiped = false;
      }, { passive: true });

      miniPlayer.addEventListener('touchend', (e) => {
        if (!touchStart) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
          swiped = true;
          if (dx < 0) miniNextBtn.click();
          else if (current > 0) playTrack(current - 1);
          else if (allTracks.length) playTrack(allTracks.length - 1);
        } else if (dy < -60 && Math.abs(dy) > Math.abs(dx)) {
          swiped = true;
          openFull();
        }
      }, { passive: true });

      miniPlayer.addEventListener('click', () => {
        if (swiped) { swiped = false; return; }
        openFull();
      });
      document.getElementById('fpCloseBtn').addEventListener('click', () => {
        fullPlayer.classList.remove('active');
        stopViz();
      });

      // ---------- Добавление файлов ----------
      const fileInput = document.getElementById('fileInput');
      document.getElementById('addBtn').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async () => {
        const okExt = ['mp3', 'm4a', 'aac', 'ogg', 'oga', 'wav', 'flac', 'opus', 'mp4'];
        for (const file of fileInput.files) {
          const ext = (file.name.split('.').pop() || '').toLowerCase();
          const isAudio = (file.type && file.type.startsWith('audio/')) || okExt.includes(ext);
          if (!isAudio) {
            alert('Файл «' + file.name + '» не похож на аудио — пропущен.');
            continue;
          }
          const tags = await readTags(file);
          await idbPut({
            id: Date.now() + Math.random(),
            addedAt: Date.now(),
            title: tags.title || file.name.replace(/\.[^.]+$/, ''),
            artist: tags.artist || '',
            coverUrl: pictureToDataURL(tags.picture),
            blob: file
          });
        }
        fileInput.value = '';
        await loadTracks();
      });

      // ---------- Экспорт и импорт ----------
      function blobToBase64(blob) {
        return new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result.split(',')[1] || '');
          r.onerror = () => resolve('');
          r.readAsDataURL(blob);
        });
      }

      document.getElementById('exportBtn').addEventListener('click', async () => {
        const tracks = await idbGetAll();
        if (!tracks.length) { alert('Библиотека пуста — нечего экспортировать.'); return; }
        const out = [];
        for (const t of tracks) {
          const item = {
            title: t.title, artist: t.artist || '', coverUrl: t.coverUrl || null,
            addedAt: t.addedAt || 0, mime: t.blob ? t.blob.type : null
          };
          if (t.blob) item.data = await blobToBase64(t.blob);
          out.push(item);
        }
        const payload = { app: 'music-mini-app', version: 1, exportedAt: new Date().toISOString(), tracks: out };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'library-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      });

      document.getElementById('importBtn').addEventListener('click', () => importInput.click());

      importInput.addEventListener('change', async () => {
        const file = importInput.files[0];
        if (!file) return;
        try {
          const j = JSON.parse(await file.text());
          const list = j.tracks || [];
          let added = 0;
          for (const t of list) {
            const rec = {
              id: Date.now() + Math.random() + added,
              addedAt: t.addedAt || Date.now(),
              title: t.title || 'Без названия',
              artist: t.artist || '',
              coverUrl: t.coverUrl || null
            };
            if (t.data) {
              const bin = atob(t.data);
              const arr = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
              rec.blob = new Blob([arr], { type: t.mime || 'audio/mpeg' });
            }
            await idbPut(rec);
            added++;
          }
          await loadTracks();
          alert('Импортировано треков: ' + added);
        } catch (e) {
          alert('Не удалось прочитать файл импорта.');
        }
        importInput.value = '';
      });

      // ---------- Шаринг-карточка ----------
      shareBtn.addEventListener('click', async () => {
        const track = current >= 0 ? allTracks[current] : null;
        if (!track) return;

        const title = track.title || 'Без названия';
        const artist = track.artist || '';
        const time = audio.duration ? fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration) : '';

        const c = document.createElement('canvas');
        c.width = 720; c.height = 960;
        const ctx = c.getContext('2d');

        const [r, g, b] = glowColor;
        const grad = ctx.createLinearGradient(0, 0, 0, 960);
        grad.addColorStop(0, 'rgb(' + Math.min(255, r + 25) + ',' + Math.min(255, g + 25) + ',' + Math.min(255, b + 25) + ')');
        grad.addColorStop(1, 'rgb(15,15,18)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 720, 960);

        const coverImg = track.coverUrl ? await new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = track.coverUrl;
        }) : null;

        const coverSize = 440;
        const covX = (720 - coverSize) / 2, covY = 120;
        ctx.save();
        ctx.beginPath();
        const rad = 28;
        ctx.moveTo(covX + rad, covY);
        ctx.arcTo(covX + coverSize, covY, covX + coverSize, covY + coverSize, rad);
        ctx.arcTo(covX + coverSize, covY + coverSize, covX, covY + coverSize, rad);
        ctx.arcTo(covX, covY + coverSize, covX, covY, rad);
        ctx.arcTo(covX, covY, covX + coverSize, covY, rad);
        ctx.closePath();
        ctx.clip();
        if (coverImg) {
          ctx.drawImage(coverImg, covX, covY, coverSize, coverSize);
        } else {
          const h = hashCode(title) % 360;
          ctx.fillStyle = 'hsl(' + h + ', 30%, 18%)';
          ctx.fillRect(covX, covY, coverSize, coverSize);
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.font = '700 150px -apple-system, Segoe UI, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText((title.charAt(0) || '?').toUpperCase(), 360, covY + coverSize / 2 + 50);
        }
        ctx.restore();

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 40px -apple-system, Segoe UI, sans-serif';
        const lines = [];
        let line = '';
        for (const word of title.split(' ')) {
          const test = line ? line + ' ' + word : word;
          if (ctx.measureText(test).width > 640 && line) { lines.push(line); line = word; }
          else line = test;
        }
        if (line) lines.push(line);
        let ty = 680;
        lines.slice(0, 2).forEach(l => { ctx.fillText(l, 60, ty); ty += 50; });

        if (artist) {
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.font = '400 28px -apple-system, Segoe UI, sans-serif';
          ctx.fillText(artist, 60, ty + 12);
        }
        if (time) {
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.font = '600 24px -apple-system, Segoe UI, sans-serif';
          ctx.fillText(time, 60, 900);
        }
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.font = '600 22px -apple-system, Segoe UI, sans-serif';
        ctx.fillText('Music Mini App', 660, 900);

        const cardBlob = await new Promise((resolve) => c.toBlob(resolve, 'image/png'));
        if (!cardBlob) return;
        const file = new File([cardBlob], 'now-playing.png', { type: 'image/png' });

        let shared = false;
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: title, text: (artist ? artist + ' — ' : '') + title });
            shared = true;
          }
        } catch (e) { if (e.name === 'AbortError') return; }

        if (!shared) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(cardBlob);
          a.download = 'now-playing.png';
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        }
      });

      // ---------- Старт ----------
      loadTracks();
    })();
  </script>
</body>
</html>
