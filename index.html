<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Music Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #f4f4f4);
        color: var(--tg-theme-text-color, #333);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: var(--tg-theme-button-color, #2481cc);
        margin-top: 0;
      }
      .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 15px;
        width: 100%;
        max-width: 600px;
        margin-top: 20px;
      }
      .card {
        background: var(--tg-theme-secondary-bg-color, #ffffff);
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .cover-placeholder {
        width: 100%;
        height: 140px;
        background-color: #eef2f5;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 40px;
      }
      .title {
        font-weight: bold;
        margin-bottom: 15px;
        font-size: 14px;
      }
      button {
        background-color: var(--tg-theme-button-color, #2481cc);
        color: var(--tg-theme-button-text-color, #ffffff);
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        width: 100%;
      }
      button:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1 id="greeting">Привет, друг!</h1>
    <div class="cards-container" id="app"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();

      const tracks = [
        { title: 'Трек 1', cover: '🎵' },
        { title: 'Newstar', cover: '⭐' },
        { title: 'Slikk', cover: '🔥' }
      ];

      const user = tg.initDataUnsafe?.user;
      const greetingEl = document.getElementById('greeting');
      if (user && greetingEl) {
        greetingEl.textContent = `Привет, \${user.first_name}!`;
      }

      const container = document.getElementById('app');
      tracks.forEach(t => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="cover-placeholder">\${t.cover}</div>
          <div class="title">\${t.title}</div>
          <button onclick="alert('Здесь будет ссылка на аудио')">Слушать</button>
        `;
        container.appendChild(div);
      });
    </script>
  </body>
</html>
