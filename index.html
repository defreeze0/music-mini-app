<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
      h1 { text-align: center; color: #2481cc; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
      .card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .cover { font-size: 40px; margin-bottom: 10px; }
      .title { font-weight: bold; margin-bottom: 10px; }
      button { background: #2481cc; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
      button:hover { background: #1a6da3; }
    </style>
  </head>
  <body>
    <h1 id="greeting">Загрузка...</h1>
    <div id="app" class="grid"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();

      const tracks = [
        { title: 'Трек 1', cover: '🎵', url: 'audio/track1.mp3' },
        { title: 'Newstar', cover: '⭐', url: 'audio/newstar.mp3' },
        { title: 'Slikk', cover: '🔥', url: 'audio/slikk.mp3' }
      ];

      const user = tg.initDataUnsafe?.user;
      document.getElementById('greeting').innerText = user ? `Привет, \${user.first_name}!` : 'Привет, друг!';

      const container = document.getElementById('app');
      tracks.forEach(t => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="cover">\${t.cover}</div>
          <div class="title">\${t.title}</div>
          <button onclick="tg.openLink('\${t.url}')">Слушать</button>
        `;
        container.appendChild(div);
      });
    </script>
  </body>
</html>
